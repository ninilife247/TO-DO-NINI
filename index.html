<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 할 일</title>
</head>
<body>
  <h1>나의 할 일</h1>

  <div>
    <input type="text" id="todo-input" placeholder="할 일을 적어 주세요">
    <button type="button" id="add-button">추가</button>
  </div>

  <ul id="todo-list">
    <li>
      <input type="checkbox">
      <span>예시 할 일</span>
      <button type="button">삭제</button>
    </li>
  </ul>

  <p id="empty-message">아직 할 일이 없어요</p>

  <p id="remaining-count">남은 할 일 1개</p>
</body>
</html>
