<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To do list</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1><img src="https://pnmivezqsljfptgxqgqi.supabase.co/storage/v1/object/public/files/todo-logo-raw.png" alt="오늘의 할 일"></h1>
  <input id="item" placeholder="할 일 적기">
  <button id="add" type="button">추가</button>
  <input id="date" type="date" aria-label="날짜">
  <div id="filters">
    <button type="button" data-filter="all">전체</button>
    <button type="button" data-filter="remaining">남은 것</button>
    <button type="button" data-filter="done">완료</button>
    <button type="button" data-filter="starred">별표만</button>
  </div>
  <ul id="list">
    <li><input type="checkbox"> 우유 <button type="button">삭제</button></li>
    <li><input type="checkbox"> 계란 <button type="button">삭제</button></li>
    <li><input type="checkbox"> 사과 <button type="button">삭제</button></li>
  </ul>
  <button id="clear-done" type="button">완료 항목 지우기</button>
  <p>남은 개수: <span id="count">3</span></p>
  <script src="script.js"></script>
</body>
</html>
